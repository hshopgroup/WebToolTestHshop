<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hshop Web Tools Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --border: #334155;
            --primary: #3b82f6;
        }
        body {
            margin: 0;
            padding: 0;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background: rgba(15, 23, 42, 0.9);
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
        
        .grid {
            display: flex;
            flex: 1;
            padding: 10px;
            gap: 10px;
        }
        
        .col {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 10px;
        }

        iframe {
            flex: 1;
            width: 100%;
            height: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #1e293b;
        }
        
        .terminal-col {
            flex: 0 0 500px;
        }

        .toggle-group {
            display: flex;
            gap: 15px;
            font-size: 0.9rem;
            align-items: center;
        }
        .toggle-group label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .v-resizer {
            width: 8px;
            cursor: col-resize;
            background: transparent;
            border-radius: 4px;
            transition: background 0.2s;
            margin: 0 -4px;
            z-index: 10;
        }
        .v-resizer:hover, .v-resizer.resizing { background: rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body>
    <header>
        <h1>Trạm điều khiển trung tâm (Dashboard)</h1>
        <div class="toggle-group">
            <label><input type="checkbox" checked onchange="toggleView('terminal-col')"> Terminal</label>
            <label><input type="checkbox" id="cbScript" checked onchange="toggleScript()"> Script List</label>
            <label><input type="checkbox" checked onchange="toggleView('plotter1')"> Plotter 1</label>
            <label><input type="checkbox" checked onchange="toggleView('plotter2')"> Plotter 2</label>
            <span style="color: #94a3b8; font-size: 0.8rem; margin-left: 20px;">* Chỉ cần Connect ở 1 cửa sổ, dữ liệu sẽ tự đồng bộ.</span>
        </div>
    </header>
    
    <div class="grid">
        <!-- Cột trái: Chỉ hiện Terminal & Script -->
        <div class="col terminal-col" id="terminal-col">
            <iframe src="Web_SerialPloter_Anti.html?hide=plotter,guide"></iframe>
        </div>
        
        <div class="v-resizer" id="dashboard-v-resizer"></div>

        <div class="col" id="plotter-col">
            <iframe id="plotter1" src="Web_SerialPloter_Anti.html?hide=terminal,script,guide,controls"></iframe>
            <iframe id="plotter2" src="Web_SerialPloter_Anti.html?hide=terminal,script,guide,controls"></iframe>
        </div>
    </div>

    <script>
        // --- Ẩn hiện giao diện ---
        function toggleView(id) {
            const el = document.getElementById(id);
            if (el.style.display === 'none') {
                el.style.display = 'flex'; // Iframe or div
            } else {
                el.style.display = 'none';
            }

            const p1 = document.getElementById('plotter1').style.display !== 'none';
            const p2 = document.getElementById('plotter2').style.display !== 'none';
            const plotterCol = document.getElementById('plotter-col');
            const vResizer = document.getElementById('dashboard-v-resizer');
            const terminalCol = document.getElementById('terminal-col');
            
            if (!p1 && !p2) {
                if (plotterCol) plotterCol.style.display = 'none';
                if (vResizer) vResizer.style.display = 'none';
                terminalCol.style.width = '100%';
                terminalCol.style.flex = '1';
            } else {
                if (plotterCol) plotterCol.style.display = 'flex';
                if (vResizer) vResizer.style.display = 'block';
            }
        }

        function toggleScript() {
            const isChecked = document.getElementById('cbScript').checked;
            const iframe = document.querySelector('.terminal-col iframe');
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage({ type: 'TOGGLE_SCRIPT', show: isChecked }, '*');
            }
        }

        // --- Kéo thả đổi kích thước ---
        const vResizer = document.getElementById('dashboard-v-resizer');
        const terminalCol = document.getElementById('terminal-col');
        let isResizing = false;

        vResizer.addEventListener('mousedown', () => {
            isResizing = true;
            document.body.style.cursor = 'col-resize';
            vResizer.classList.add('resizing');
            // Chặn iframe nuốt sự kiện chuột khi đang kéo
            document.querySelectorAll('iframe').forEach(ifr => ifr.style.pointerEvents = 'none');
        });

        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            const newWidth = e.clientX - terminalCol.getBoundingClientRect().left;
            if (newWidth > 300 && newWidth < window.innerWidth - 300) {
                terminalCol.style.width = newWidth + 'px';
                terminalCol.style.flex = 'none';
            }
        });

        document.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                document.body.style.cursor = 'default';
                vResizer.classList.remove('resizing');
                document.querySelectorAll('iframe').forEach(ifr => ifr.style.pointerEvents = 'auto');
            }
        });

        // --- Iframe Bus Router ---
        // Bắt mọi tín hiệu từ các Iframe con và phát lại (Relay) cho các Iframe còn lại
        window.addEventListener('message', (e) => {
            const iframes = document.querySelectorAll('iframe');
            iframes.forEach(iframe => {
                // Không gửi ngược lại cho chính Iframe vừa phát tín hiệu
                if (iframe.contentWindow !== e.source) {
                    iframe.contentWindow.postMessage(e.data, '*');
                }
            });
        });
    </script>
</body>
</html>
