<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hshop Web Tools Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --border: #334155;
            --primary: #3b82f6;
        }
        body {
            margin: 0;
            padding: 0;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background: rgba(15, 23, 42, 0.9);
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-auto-rows: minmax(50px, auto);
            gap: 10px;
            padding: 10px;
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #1e293b;
        }

        .shortcut-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            color: #ffffff;
            font-size: 1.1rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        .shortcut-btn:active {
            transform: scale(0.98);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); display: none;
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal {
            background: var(--bg-color);
            padding: 20px; border-radius: 8px;
            width: 90%; max-width: 900px;
            max-height: 90vh; overflow-y: auto;
            border: 1px solid var(--border);
        }
        .modal h2 { margin-top: 0; }
        .config-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
        .config-row input, .config-row select {
            padding: 5px; border-radius: 4px; border: 1px solid var(--border);
            background: #1e293b; color: #fff;
        }
        .btn-primary { background: var(--primary); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-danger { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }

    </style>
</head>
<body>
    <header>
        <h1>Trạm điều khiển trung tâm (Dashboard)</h1>
        <div class="toggle-group" style="display: flex; gap: 15px; align-items: center;">
            <div id="header-view-toggles" style="display: flex; gap: 15px; flex-wrap: wrap;"></div>
            <button class="btn-primary" onclick="openConfigModal()">Cài đặt Layout</button>
            <span style="color: #94a3b8; font-size: 0.8rem; margin-left: 20px;">* Chỉ cần Connect ở 1 cửa sổ, dữ liệu sẽ tự đồng bộ.</span>
        </div>
    </header>
    
    <div class="grid" id="dashboard-grid">
        <!-- Rendered dynamically -->
    </div>

    <!-- Modal Cấu hình -->
    <div class="modal-overlay" id="configModal">
        <div class="modal">
            <h2>Cấu hình Layout Dashboard</h2>
            
            <h3>Danh sách Views (Iframes)</h3>
            <div id="viewsConfigArea"></div>
            <button class="btn-primary" onclick="addViewConfig()" style="margin-bottom: 20px;">+ Thêm View</button>
            <hr style="border: 1px solid var(--border);">
            
            <h3>Cài đặt Thư mục làm việc (Workspace)</h3>
            <div style="margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
                <button class="btn-secondary" onclick="selectWorkspace()" style="background: var(--border); color: var(--text-color); border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">Chọn thư mục mặc định</button>
                <span id="workspaceStatus" style="color: #94a3b8; font-size: 0.9rem;">Chưa cấu hình</span>
            </div>
            <hr style="border: 1px solid var(--border);">
            
            <h3>Danh sách Shortcut Buttons</h3>
            <div id="shortcutsConfigArea"></div>
            <button class="btn-primary" onclick="addShortcutConfig()">+ Thêm Shortcut</button>
            
            <div style="margin-top: 30px; display: flex; justify-content: flex-end; gap: 10px;">
                <button class="btn-danger" onclick="closeConfigModal()">Hủy</button>
                <button class="btn-primary" onclick="saveConfig()">Lưu & Hiển thị</button>
            </div>
        </div>
    </div>

    <script>
        // --- IndexedDB for FSA API ---
        const DB_NAME = 'Hshop_FSA_DB';
        const STORE_NAME = 'handles';

        function initDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = e => {
                    e.target.result.createObjectStore(STORE_NAME);
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function saveHandle(key, handle) {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).put(handle, key);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        async function getHandle(key) {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const req = tx.objectStore(STORE_NAME).get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function verifyPermission(fileHandle, readWrite) {
            const options = {};
            if (readWrite) {
                options.mode = 'readwrite';
            }
            if ((await fileHandle.queryPermission(options)) === 'granted') {
                return true;
            }
            if ((await fileHandle.requestPermission(options)) === 'granted') {
                return true;
            }
            return false;
        }

        let dashboardConfig = {
            views: [
                { id: "v1", url: "Web_SerialPloter_Anti.html?hide=plotter,guide", w: 6, h: 12 },
                { id: "v2", url: "Web_SerialPloter_Anti.html?hide=terminal,script,guide,controls", w: 6, h: 6 },
                { id: "v3", url: "Web_SerialPloter_Anti.html?hide=terminal,script,guide,controls", w: 6, h: 6 }
            ],
            shortcuts: []
        };

        function renderDashboard() {
            const grid = document.getElementById('dashboard-grid');
            grid.innerHTML = '';
            
            const headerToggles = document.getElementById('header-view-toggles');
            headerToggles.innerHTML = '';
            
            dashboardConfig.views.forEach((v, idx) => {
                if (v.visible === undefined) v.visible = true; // Default
                
                // Add to Header Toggles
                const label = document.createElement('label');
                label.style.cursor = 'pointer';
                label.style.display = 'flex';
                label.style.alignItems = 'center';
                label.style.gap = '5px';
                label.innerHTML = `<input type="checkbox" ${v.visible ? 'checked' : ''} onchange="toggleViewVisible(${idx}, this.checked)"> View ${idx + 1}`;
                headerToggles.appendChild(label);
                
                if (v.visible) {
                    const ifr = document.createElement('iframe');
                    const viewName = `View ${idx + 1}`;
                    const sep = v.url.includes('?') ? '&' : '?';
                    ifr.src = `${v.url}${sep}viewName=${encodeURIComponent(viewName)}`;
                    ifr.style.gridColumn = `span ${v.w}`;
                    ifr.style.gridRow = `span ${v.h}`;
                    grid.appendChild(ifr);
                }
            });
            
            dashboardConfig.shortcuts.forEach((s, idx) => {
                if (s.visible === undefined) s.visible = true;
                
                if (s.visible) {
                    const btn = document.createElement('button');
                    btn.className = 'shortcut-btn';
                    btn.textContent = s.label;
                    btn.style.backgroundColor = s.color || '#3b82f6';
                    btn.style.gridColumn = `span ${s.w}`;
                    btn.style.gridRow = `span ${s.h}`;
                    btn.onclick = () => {
                        broadcastMessage({ type: 'SEND_CMD', cmd: s.cmd });
                    };
                    grid.appendChild(btn);
                }
            });

            // Gửi config xuống iframes để chuẩn bị Export nếu cần
            setTimeout(() => {
                broadcastMessage({ type: 'SYNC_DASHBOARD_CONFIG', data: dashboardConfig });
            }, 1000); // Đợi iframe load xong
        }

        function toggleViewVisible(idx, isVisible) {
            dashboardConfig.views[idx].visible = isVisible;
            renderDashboard();
        }

        function broadcastMessage(msg) {
            const iframes = document.querySelectorAll('iframe');
            iframes.forEach(iframe => {
                if (iframe.contentWindow) iframe.contentWindow.postMessage(msg, '*');
            });
        }

        // --- Iframe Bus Router ---
        window.addEventListener('message', async (e) => {
            if (e.data && e.data.type === 'FSA_SAVE_FILE') {
                await saveToFileDashboard(e.data.blob, e.data.defaultName, e.data.isAuto, e.data.subFolder);
                return;
            }
            if (e.data && e.data.type === 'FSA_OPEN_FILE') {
                await openFileDashboard(e.source, e.data.subFolder);
                return;
            }
            
            if (e.data && e.data.type === 'LOAD_DASHBOARD_CONFIG') {
                dashboardConfig = e.data.data;
                renderDashboard();
                return;
            }

            const iframes = document.querySelectorAll('iframe');
            iframes.forEach(iframe => {
                if (iframe.contentWindow !== e.source) {
                    iframe.contentWindow.postMessage(e.data, '*');
                }
            });
        });

        async function saveToFileDashboard(blob, defaultName, isAuto = false, subFolder = null) {
            try {
                let dirHandle = null;
                try { dirHandle = await getHandle('workspace_dir'); } catch(e) {}
                
                let targetDirHandle = dirHandle;
                if (dirHandle && subFolder) {
                    try {
                        targetDirHandle = await dirHandle.getDirectoryHandle(subFolder, { create: true });
                    } catch(e) { console.warn("Lỗi tạo/đọc thư mục con:", e); }
                }
                
                if (targetDirHandle) {
                    try {
                        const fileHandle = await targetDirHandle.getFileHandle(defaultName, { create: true });
                        const writable = await fileHandle.createWritable();
                        await writable.write(blob);
                        await writable.close();
                        if (!isAuto) {
                            alert(`Đã xuất file thành công vào thư mục "${subFolder}":\n${defaultName}`);
                        } else {
                            console.log("Đã tự động lưu file: " + defaultName);
                        }
                        return;
                    } catch(err) {
                        console.warn("Direct write failed, falling back", err);
                    }
                }
                
                if (!isAuto && window.showSaveFilePicker) {
                    let opts = { suggestedName: defaultName };
                    if (targetDirHandle) {
                        opts.startIn = targetDirHandle;
                    }
                    
                    try {
                        const fileHandle = await window.showSaveFilePicker(opts);
                        const writable = await fileHandle.createWritable();
                        await writable.write(blob);
                        await writable.close();
                        return;
                    } catch(e) {
                        if (e.name === 'AbortError') return;
                        if (e.message.includes('Cross origin') || e.name === 'SecurityError' || e.name === 'NotAllowedError') {
                            console.warn("showSaveFilePicker block by policy, fallback to <a> download");
                        } else {
                            throw e;
                        }
                    }
                } 
                
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = defaultName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } catch(e) {
                if (e.name !== 'AbortError') {
                    console.error("Lỗi lưu file:", e);
                    alert("Không thể lưu file (Dashboard): " + e.message);
                }
            }
        }

        async function openFileDashboard(sourceIframe, subFolder = null) {
            try {
                if (!window.showOpenFilePicker) {
                    sourceIframe.postMessage({ type: 'FSA_FILE_FALLBACK' }, '*');
                    return;
                }
                
                let opts = {
                    types: [{
                        description: 'Files',
                        accept: {
                            'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'],
                            'text/plain': ['.txt', '.csv']
                        }
                    }]
                };
                
                try {
                    const dirHandle = await getHandle('workspace_dir');
                    let targetDirHandle = dirHandle;
                    if (dirHandle && subFolder) {
                        try {
                            targetDirHandle = await dirHandle.getDirectoryHandle(subFolder, { create: true });
                        } catch(e) {}
                    }
                    if (targetDirHandle) opts.startIn = targetDirHandle;
                } catch(e) {}
                
                try {
                    const [fileHandle] = await window.showOpenFilePicker(opts);
                    const file = await fileHandle.getFile();
                    const arrayBuffer = await file.arrayBuffer();
                    sourceIframe.postMessage({
                        type: 'FSA_FILE_OPENED',
                        filename: file.name,
                        buffer: arrayBuffer
                    }, '*');
                } catch(e) {
                    if (e.name !== 'AbortError') {
                        sourceIframe.postMessage({ type: 'FSA_FILE_FALLBACK' }, '*');
                    }
                }
            } catch (e) {
                console.error("Lỗi đọc file:", e);
            }
        }

        // --- Modal Logic ---
        function openConfigModal() {
            renderConfigForms();
            checkWorkspaceStatus();
            document.getElementById('configModal').style.display = 'flex';
        }
        
        async function checkWorkspaceStatus() {
            try {
                const handle = await getHandle('workspace_dir');
                if (handle) {
                    document.getElementById('workspaceStatus').textContent = `Đã thiết lập: ${handle.name}`;
                    document.getElementById('workspaceStatus').style.color = '#10b981';
                }
            } catch (e) {}
        }
        
        async function selectWorkspace() {
            try {
                if (!window.showDirectoryPicker) {
                    alert("Trình duyệt của bạn không hỗ trợ tính năng chọn thư mục mặc định (File System Access API). Vui lòng dùng Chrome/Edge trên HTTPS hoặc Localhost.");
                    return;
                }
                const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
                await saveHandle('workspace_dir', dirHandle);
                checkWorkspaceStatus();
                alert("Đã thiết lập thư mục làm việc thành công!");
            } catch (e) {
                if (e.name !== 'AbortError') alert("Lỗi: " + e.message);
            }
        }

        function closeConfigModal() {
            document.getElementById('configModal').style.display = 'none';
        }

        function renderConfigForms() {
            const vArea = document.getElementById('viewsConfigArea');
            vArea.innerHTML = '';
            dashboardConfig.views.forEach((v, idx) => {
                const div = document.createElement('div');
                div.className = 'config-row';
                div.innerHTML = `
                    <span style="width: 50px; font-weight: bold;">View ${idx+1}:</span>
                    <input type="checkbox" ${v.visible !== false ? 'checked' : ''} title="Hiển thị View này" onchange="dashboardConfig.views[${idx}].visible=this.checked">
                    <input type="text" value="${v.url}" placeholder="URL (vd: ?hide=...)" style="flex: 1; min-width: 300px;" onchange="dashboardConfig.views[${idx}].url=this.value">
                    <span>Width:</span><input type="number" value="${v.w}" min="1" max="12" style="width: 50px" onchange="dashboardConfig.views[${idx}].w=parseInt(this.value)||1">
                    <span>Height:</span><input type="number" value="${v.h}" min="1" style="width: 50px" onchange="dashboardConfig.views[${idx}].h=parseInt(this.value)||1">
                    <button class="btn-danger" onclick="dashboardConfig.views.splice(${idx}, 1); renderConfigForms()">Xóa</button>
                `;
                vArea.appendChild(div);
            });

            const sArea = document.getElementById('shortcutsConfigArea');
            sArea.innerHTML = '';
            dashboardConfig.shortcuts.forEach((s, idx) => {
                const div = document.createElement('div');
                div.className = 'config-row';
                div.innerHTML = `
                    <span style="width: 50px; font-weight: bold;">Nút ${idx+1}:</span>
                    <input type="checkbox" ${s.visible !== false ? 'checked' : ''} title="Hiển thị Shortcut này" onchange="dashboardConfig.shortcuts[${idx}].visible=this.checked">
                    <input type="text" value="${s.label}" placeholder="Tên Nút" style="width: 150px;" onchange="dashboardConfig.shortcuts[${idx}].label=this.value">
                    <input type="text" value="${s.cmd}" placeholder="Lệnh gửi" style="flex: 1;" onchange="dashboardConfig.shortcuts[${idx}].cmd=this.value">
                    <input type="color" value="${s.color || '#3b82f6'}" style="width: 40px; height: 35px; padding: 0;" onchange="dashboardConfig.shortcuts[${idx}].color=this.value">
                    <span>Width:</span><input type="number" value="${s.w}" min="1" max="12" style="width: 50px" onchange="dashboardConfig.shortcuts[${idx}].w=parseInt(this.value)||1">
                    <span>Height:</span><input type="number" value="${s.h}" min="1" style="width: 50px" onchange="dashboardConfig.shortcuts[${idx}].h=parseInt(this.value)||1">
                    <button class="btn-danger" onclick="dashboardConfig.shortcuts.splice(${idx}, 1); renderConfigForms()">Xóa</button>
                `;
                sArea.appendChild(div);
            });
        }

        function addViewConfig() {
            dashboardConfig.views.push({ url: "Web_SerialPloter_Anti.html", w: 6, h: 6 });
            renderConfigForms();
        }
        function addShortcutConfig() {
            dashboardConfig.shortcuts.push({ label: "Nút mới", cmd: "", color: "#3b82f6", w: 3, h: 1 });
            renderConfigForms();
        }
        function saveConfig() {
            renderDashboard();
            closeConfigModal();
        }

        // Khởi tạo ban đầu
        renderDashboard();
    </script>
</body>
</html>
