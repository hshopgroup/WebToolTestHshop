<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hshop Web Tools Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --border: #334155;
            --primary: #3b82f6;
        }
        body {
            margin: 0;
            padding: 0;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background: rgba(15, 23, 42, 0.9);
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
        
        .grid {
            display: flex;
            flex: 1;
            padding: 10px;
            gap: 10px;
        }
        
        .col {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 10px;
        }

        iframe {
            flex: 1;
            width: 100%;
            height: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #1e293b;
        }
        
        .terminal-col {
            flex: 0 0 500px;
        }

        .toggle-group {
            display: flex;
            gap: 15px;
            font-size: 0.9rem;
            align-items: center;
        }
        .toggle-group label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Trạm điều khiển trung tâm (Dashboard)</h1>
        <div class="toggle-group">
            <label><input type="checkbox" checked onchange="toggleView('terminal-col')"> Terminal</label>
            <label><input type="checkbox" checked onchange="toggleView('plotter1')"> Plotter 1</label>
            <label><input type="checkbox" checked onchange="toggleView('plotter2')"> Plotter 2</label>
            <span style="color: #94a3b8; font-size: 0.8rem; margin-left: 20px;">* Chỉ cần Connect ở 1 cửa sổ, dữ liệu sẽ tự đồng bộ.</span>
        </div>
    </header>
    
    <div class="grid">
        <!-- Cột trái: Chỉ hiện Terminal & Script -->
        <div class="col terminal-col" id="terminal-col">
            <iframe src="Web_SerialPloter_Anti.html?hide=plotter,guide"></iframe>
        </div>
        
        <!-- Cột phải: Hiện 2 Plotter độc lập để so sánh Range và All -->
        <div class="col">
            <iframe id="plotter1" src="Web_SerialPloter_Anti.html?hide=terminal,script,guide"></iframe>
            <iframe id="plotter2" src="Web_SerialPloter_Anti.html?hide=terminal,script,guide"></iframe>
        </div>
    </div>

    <script>
        // --- Ẩn hiện giao diện ---
        function toggleView(id) {
            const el = document.getElementById(id);
            if (el.style.display === 'none') {
                el.style.display = 'flex'; // Iframe or div
            } else {
                el.style.display = 'none';
            }
        }

        // --- Iframe Bus Router ---
        // Bắt mọi tín hiệu từ các Iframe con và phát lại (Relay) cho các Iframe còn lại
        window.addEventListener('message', (e) => {
            const iframes = document.querySelectorAll('iframe');
            iframes.forEach(iframe => {
                // Không gửi ngược lại cho chính Iframe vừa phát tín hiệu
                if (iframe.contentWindow !== e.source) {
                    iframe.contentWindow.postMessage(e.data, '*');
                }
            });
        });
    </script>
</body>
</html>
